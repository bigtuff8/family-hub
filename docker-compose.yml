version: '3.8'

services:
  # Caddy Reverse Proxy - Single entry point for frontend + API
  caddy:
    image: caddy:2-alpine
    container_name: familyhub-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: familyhub-db
    environment:
      POSTGRES_USER: familyhub
      POSTGRES_PASSWORD: familyhub_password
      POSTGRES_DB: familyhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: familyhub-backend
    pid: "host"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    environment:
      DATABASE_URL: postgresql+asyncpg://familyhub:familyhub_password@db:5432/familyhub
      JWT_SECRET: dev-secret-key-change-in-production
      ENVIRONMENT: development
      # For OAuth callbacks - set to Pi's Tailscale IP for remote access
      API_BASE_URL: ${API_BASE_URL:-http://100.118.56.111:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
    volumes:
      - ./backend:/app
      - /home/bigtuff8/.config/autostart:/host-autostart
      - /home/bigtuff8/kiosk.sh:/host-kiosk/kiosk.sh:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: familyhub-frontend
    environment:
      VITE_API_URL: ""
      VITE_GETADDRESS_API_KEY: WdZk5HROZ06OnCmwB3BJCg49348
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Alexa Shopping List Sync Service
  alexa-sync:
    build:
      context: ./services/alexa-sync
      dockerfile: Dockerfile
    container_name: familyhub-alexa-sync
    environment:
      FAMILYHUB_API_URL: http://backend:8000
      FAMILYHUB_API_KEY: ${ALEXA_SYNC_API_KEY:-}
      POLL_INTERVAL_MINUTES: "5"
      SYNC_DIRECTION: bidirectional
      AMAZON_DOMAIN: www.amazon.co.uk
      LOG_LEVEL: INFO
    volumes:
      - alexa_sync_data:/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  alexa_sync_data:
